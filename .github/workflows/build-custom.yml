name: Build Custom Windows

on:
  push:
    branches:
      - compat-v1.9.12
  workflow_dispatch:
    inputs:
      dependencies_only:
        description: "Only prepare SDK patches and lockfile (no lifecycle scripts, build or tests)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Prepare model SDK dependencies without lifecycle scripts
        # Bootstrap only until both generated patches + manifests + lockfile are committed.
        # All preparation commands skip lifecycle scripts, including the frozen fast path.
        run: node scripts/prepare-model-sdk.cjs --prepare

      - name: Upload resolved SDK dependency files
        uses: actions/upload-artifact@v4
        with:
          name: model-sdk-dependencies-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            patches/@ai-sdk__google@3.0.138.patch
            patches/@ai-sdk__openai@3.0.131.patch

      - name: Upload modified source files
        uses: actions/upload-artifact@v4
        with:
          name: model-adaptation-source-${{ github.run_number }}
          retention-days: 7
          include-hidden-files: true
          path: |
            .gitignore
            .github/workflows/build-custom.yml
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            patches/@ai-sdk__google@3.0.138.patch
            patches/@ai-sdk__openai@3.0.131.patch
            src/renderer/src/aiCore/chunk/AiSdkToChunkAdapter.ts
            src/renderer/src/types/modelProfile.ts
            src/renderer/src/types/provider.ts
            src/renderer/src/config/modelProfiles.ts
            src/renderer/src/config/models/reasoning.ts
            src/renderer/src/config/models/websearch.ts
            src/renderer/src/hooks/useAssistant.ts
            src/renderer/src/aiCore/provider/extensions/index.ts
            src/renderer/src/aiCore/provider/extensions/modelProfile.ts
            src/renderer/src/aiCore/provider/providerConfig.ts
            src/renderer/src/aiCore/utils/options.ts
            src/renderer/src/aiCore/prepareParams/modelParameters.ts
            src/renderer/src/aiCore/prepareParams/parameterBuilder.ts
            src/renderer/src/aiCore/plugins/PluginBuilder.ts
            src/renderer/src/aiCore/plugins/modelProfilePlugin.ts
            src/renderer/src/aiCore/plugins/pdfCompatibilityPlugin.ts
            src/renderer/src/aiCore/prepareParams/modelCapabilities.ts
            src/renderer/src/aiCore/prepareParams/messageConverter.ts
            src/renderer/src/aiCore/AiProvider.ts
            src/renderer/src/services/ApiService.ts
            src/renderer/src/utils/assistant.ts
            src/renderer/src/pages/home/Inputbar/Inputbar.tsx
            src/renderer/src/pages/home/Inputbar/tools/generateImageTool.tsx
            src/renderer/src/aiCore/prepareParams/fileProcessor.ts
            src/renderer/src/pages/settings/AssistantSettings/AssistantModelSettings.tsx
            src/renderer/src/pages/home/Inputbar/tools/thinkingTool.tsx
            src/renderer/src/pages/settings/ProviderSettings/EditModelPopup/ModelEditContent.tsx
            src/renderer/src/pages/settings/ProviderSettings/EditModelPopup/ModelProfileEditor.tsx
            src/renderer/src/pages/home/Inputbar/tools/urlContextTool.tsx
            src/renderer/src/pages/home/Inputbar/tools/components/ThinkingButton.tsx
            src/renderer/src/pages/home/Inputbar/tools/components/UrlContextbutton.tsx
            src/renderer/src/pages/home/Inputbar/tools/components/WebSearchQuickPanelManager.tsx
            src/renderer/src/pages/home/Inputbar/tools/components/MCPToolsButton.tsx
            packages/aiCore/package.json
            scripts/prepare-model-sdk.cjs
            docs/zh/guides/model-adaptation*

      - name: Install build dependencies with lifecycle scripts
        if: ${{ inputs.dependencies_only != true }}
        env:
          npm_config_ignore_scripts: "false"
        run: |
          pnpm --config.ignore-scripts=false install --frozen-lockfile
          # Preparation already linked packages: install alone may leave pending builds.
          # Include every workspace and the root; retain the project's build allowlist.
          pnpm --config.ignore-scripts=false --config.include-workspace-root=true -r rebuild --pending

      - name: Build application
        if: ${{ inputs.dependencies_only != true }}
        run: pnpm build

      - name: Package Windows x64
        if: ${{ inputs.dependencies_only != true }}
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Record build information
        run: |
          printf "Commit: %s\n" "$GITHUB_SHA" > build-info.txt
          printf "Branch: %s\n" "$GITHUB_REF_NAME" >> build-info.txt
          printf "Run: %s\n" "$GITHUB_RUN_NUMBER" >> build-info.txt

      - name: Upload installers
        if: ${{ inputs.dependencies_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: CherryStudio-custom-win-x64-${{ github.run_number }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ github.run_number }}
          path: build-info.txt
          retention-days: 7
